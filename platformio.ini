[platformio]
default_envs =
    nucleo_l476rg_host_logger
    nucleo_l476rg_parallel_batteries
    nucleo_l476rg_battery_logger
src_dir = examples

[env]
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wconversion
    -Werror
    -Wno-unused-parameter
    -Wno-unused-variable
    -Wno-unused-function
lib_deps = 
    etlcpp/Embedded Template Library@^20.49.0

[env:native_test]
platform = native@^1.2.1
build_flags =
    ${env.build_flags}
    -I test
lib_deps =
    ${env.lib_deps}
    sfg_sbs
    throwtheswitch/Unity@^2.6.1

[board_nucleo_l476rg]
platform = ststm32@^20.0.0
board = nucleo_l476rg
framework = arduino
build_flags =
    ${env.build_flags}
    ; By default the I2C buffer size is 32 bytes. But the longest SBS command is a Block Write
    ; with 1 command byte, 1 size byte, and 32 data bytes, which is 34 bytes. So we just double
    ; the buffer size to 64 bytes. :^)
    -D I2C_TXRX_BUFFER_SIZE=64
build_src_flags =
    ${env.build_src_flags}
    -D NUCLEO_L476RG
lib_deps =
    ${env.lib_deps}
    stm32duino/STM32duino Low Power@^2.0.0

[board_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_flags =
    ${env.build_src_flags}
    -D PICO

[env:nucleo_l476rg_host_logger]
extends = board_nucleo_l476rg
build_src_filter = +<host_logger/>
lib_deps =
    ${env.lib_deps}
    shah253kt/Magic Enum@^0.9.5

[env:nucleo_l476rg_battery_logger]
extends = board_nucleo_l476rg
build_src_filter = +<battery_logger/>
lib_deps =
    ${env.lib_deps}
    shah253kt/Magic Enum@^0.9.5

[env:nucleo_l476rg_parallel_batteries]
extends = board_nucleo_l476rg
build_src_filter = +<parallel_batteries/>

[env:pico_battery_logger]
extends = board_pico
build_src_filter = +<battery_logger/>
lib_deps =
    ${env.lib_deps}
    shah253kt/Magic Enum@^0.9.5